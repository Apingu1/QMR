name: Extract QMR source data
on:
  push:
    branches: [qmr/apr-jun-2026-build]
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-pptx
      - run: python tools/extract_qmr.py
      - name: Commit extracted text data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/extracted
          git commit -m "Extract QMR source data" || exit 0
          git push
